services:
  piano:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piano-app
    restart: unless-stopped
    cpus: 1.75
    mem_limit: 1536m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "4173"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4173
      - STATIC_DIR=dist
      - COOKIE_SECURE=1
      - TRUST_PROXY=1
      - RATE_LIMIT_PER_MINUTE=180
      - AUTH_RATE_LIMIT=10
      - MAX_CONNECTIONS=128
      - API_QPS=30
      - CLIENT_QPS=8
      - ONLINE_LIMIT=60
      - ONLINE_PER_IP=10
      - MAX_INFLIGHT=48
      - AUTH_CONCURRENCY=2
      - NODE_OPTIONS=--max-old-space-size=768
      - PANIO_DATABASE_PATH=data/panio.sqlite
      - PANIO_UPLOADS_DIR=data/content
      - PANIO_BACKUP_DIR=backups
      - PANIO_BACKUP_RETENTION=14
    volumes:
      - piano-data:/app/data
      - piano-backups:/app/backups
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4173/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    container_name: piano-proxy
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    ports:
      - "443:443"
      - "443:443/udp"
      - "4173:4173"
    environment:
      - PANIO_PUBLIC_HOST=${PANIO_PUBLIC_HOST:-101.96.229.102}
      - GOMEMLIMIT=96MiB
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      piano:
        condition: service_healthy

volumes:
  piano-data:
  piano-backups:
  caddy-data:
  caddy-config:
